name: Deployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          BASE_PATH: /nathanael-photographe

      # Version de demonstration : on interdit l'indexation par les moteurs
      # (le vrai referencement se jouera sur nathanaelcharpentier.com)
      - name: Bloquer l'indexation de la demo
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Preparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
